# ---------------------------------------------------------------------------
# Blair Purvis — author site
#
# Most of what you'll ever want to change lives in this file.
# Edit it, save it, push it. Nothing else needs touching.
# ---------------------------------------------------------------------------

title: Blair Purvis
tagline: Novelist
description: >-
  Blair Purvis is a novelist living in Melbourne. His work is concerned with
  desire, geography, and the slow, difficult business of being known.

url: "https://blairpurvis.com"
baseurl: ""

author:
  name: Blair Purvis
  email: me@blairpurvis.com

# ---------------------------------------------------------------------------
# CONTACT & FORMS
#
# form_endpoint: leave empty until the Cloudflare Worker is deployed.
#   While empty, the contact page shows a plain email link instead of a form,
#   so the page always works. Fill it in and the form appears automatically.
# ---------------------------------------------------------------------------

form_endpoint: ""

# ---------------------------------------------------------------------------
# MAILING LIST
#
# mailing_list_action: the subscribe URL from your email provider.
#   Empty for now — the Prahran list is not switched on yet. While empty,
#   the signup block invites people to write to you instead. Nothing breaks.
# ---------------------------------------------------------------------------

mailing_list_action: ""
mailing_list_promise: >-
  A few times a year: publication news, and a little of the work before it
  is finished. Your address is never sold, never traded, and never passed to
  anyone but the mail service that delivers them.

# ---------------------------------------------------------------------------
# ANALYTICS — Google Tag Manager
#
# Paste your container ID (GTM-XXXXXXX) to switch it on. Leave it empty and
# no analytics code is loaded at all and no third-party request is made.
#
# IMPORTANT: the privacy page reads this value. Setting it automatically
# changes what /privacy/ says about tracking and cookies, so the statement
# can never fall out of step with what the site actually does. That is
# deliberate — do not remove the logic from privacy.md.
# ---------------------------------------------------------------------------

gtm_id: "GTM-PZHJTSW6"    # container also holds matm.com.au and prahran.press; GA4 property G-TMR4P2HDNJ is wired inside GTM, not here

# Consent Mode defaults. With this true, GTM starts with analytics and ad
# storage DENIED and only measures anonymously until consent is given —
# the safe posture for readers in the EU and UK. Set to false only if you
# have added a proper consent banner, or have decided the risk is yours.
gtm_consent_default_denied: true

# ---------------------------------------------------------------------------
# SOCIAL LINKS
#
# Only list accounts you actually use. A link to a dormant account takes a
# reader who was interested enough to click and shows them silence.
# Delete a line to remove it from the site. Add one to put it back.
# ---------------------------------------------------------------------------

# Rendered as icons in the footer. `icon:` picks the glyph from
# _includes/social-icons.html — add a new one there before using a new name.
# A mailto: url is left untargeted; everything else opens in a new tab.
social:
  - name: Instagram
    icon: instagram
    url: https://www.instagram.com/blairpurvisauthor
  - name: Facebook
    icon: facebook
    url: https://www.facebook.com/profile.php?id=61593616701662
  - name: TikTok
    icon: tiktok
    url: https://www.tiktok.com/@blairpurvis.author
  - name: YouTube
    icon: youtube
    url: https://www.youtube.com/channel/UCL0FUyK6clBPpzYIaZLiw4Q
  - name: Substack
    icon: substack
    url: https://substack.com/@blairpurvis
  - name: Email
    icon: email
    url: mailto:me@blairpurvis.com
  # Goodreads was a text link here before the icons went in. There is no
  # Goodreads glyph in the set yet, so it is parked rather than dropped:
  # - name: Goodreads
  #   icon: goodreads
  #   url: https://www.goodreads.com/author/show/17782851.Blair_Purvis

publisher:
  name: Prahran Publishing
  url: https://www.prahran.press

# ---------------------------------------------------------------------------
# BUILD — you shouldn't need to change anything below this line.
# ---------------------------------------------------------------------------

permalink: /writing/:title/
timezone: Australia/Melbourne

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page
