- title: The Art of Surrender
  status: forthcoming
  published: 2026-10-15
  cover: art-of-surrender.jpg
  cloth: burgundy   # binding colour used until there's a cover: burgundy, forest, indigo, tan
  places: [Morocco, Gibraltar, Switzerland, Berlin, Sydney]
  logline: A novel about power, shame, and the cost of allowing yourself to be truly known.
  blurb: >-
    Ayman Saliba and Lucas Pfifer meet as strangers and spend twenty years
    becoming something neither of them can name. Across Morocco, Gibraltar,
    Switzerland, Berlin and Sydney, theirs is a relationship conducted in
    the gaps between countries — in borrowed rooms, in languages half-learned,
    in the long silences that follow an honest sentence.
