- title: The Art of Surrender
  status: forthcoming
  published: 2026-10-15
  cover: art-of-surrender.jpg
  cloth: burgundy   # binding colour used until there's a cover: burgundy, forest, indigo, tan
  places: [Morocco, Gibraltar, Switzerland, Berlin, Sydney]
  logline: A novel about power, shame, and the cost of allowing yourself to be truly known.
  # `lede` is the hero paragraph on the home page. `blurb` is the full back-cover
  # copy and renders on /books/ as real paragraphs.
  lede: >-
    Ayman Saliba arrives in Morocco looking for permission. Lucas Pfifer
    arrives already fluent in concealment.
  blurb: |
    Ayman Saliba arrives in Morocco looking for permission. Lucas Pfifer
    arrives already fluent in concealment.

    In the heat and steam of a Moroccan ḥammām, two men meet where anonymity
    makes desire possible. Ayman is practical, watchful, newly honest with
    himself and not yet honest with everyone else. Lucas is beautiful,
    wealthy, controlled — a man who has learned to make damage look like
    elegance.

    What begins as a brief encounter becomes something neither of them can
    keep contained. From Morocco to Gibraltar, from the decks of the Phoenix
    to the snowfields of Switzerland and the ruinous appetites of Berlin,
    Ayman and Lucas are drawn into a love that exposes every imbalance
    between them: money and pride, secrecy and truth, care and control.

    But Lucas has a past that still knows how to call him back. Lazarus
    understands the part of him that believes surrender must hurt. And Ayman,
    loving him, must face the harder question: whether protecting a man can
    become another way of possessing him.

    *The Art of Surrender* is a sensual, psychologically charged novel about
    what we mistake for love, and what it costs to be truly seen, and still
    misunderstood.
  buy:
    - name: Pre-order from Prahran Publishing
      url: https://www.prahran.press/authors/blair-purvis/
